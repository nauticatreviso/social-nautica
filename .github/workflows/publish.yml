name: Pubblica su Instagram

on:
  schedule:
    - cron: "*/15 * * * *"   # ogni 15 minuti (GitHub puo' ritardare di qualche minuto)
  workflow_dispatch:          # permette anche l'avvio manuale dal tab Actions

permissions:
  contents: write             # serve per salvare published.json

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Scarica file media mancanti da Google Drive
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install google-api-python-client google-auth --quiet --break-system-packages
          python3 download_missing_media.py

      - name: Converti video orizzontali in formato Reel verticale
        run: python3 convert_videos.py

      - name: Salva file media scaricati e convertiti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/ || true
          git diff --cached --quiet || (git commit -m "Auto: download da Drive + conversione video verticale" && git pull --rebase && git push)

      - name: Pubblica su Instagram i post in scadenza
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841404468831152"
        run: python3 publish_instagram.py

      - name: Pubblica su Facebook i post in scadenza
        if: ${{ !cancelled() }}   # parte anche se Instagram ha dato errore
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: "1479050282386421"
        run: python3 publish_facebook.py

      - name: Raccolta metriche (insights)
        if: ${{ !cancelled() }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 collect_insights.py

      - name: Salva lo stato delle pubblicazioni
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published*.json insights.json || true
          git diff --cached --quiet || (git commit -m "Aggiorna stato pubblicazioni" && git pull --rebase && git push)
